# Builds Marq on Windows for every push to main.
# If the version in Cargo.toml doesn't have a release yet, publishes one with:
#   Marq.exe    - the app
#   latest.txt  - version + SHA-256, read by Marq's tray updater
name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # "Released" means published (not draft) AND both updater assets are present.
          ASSETS=$(gh release view "v$VERSION" --json isDraft,assets \
            --jq 'select(.isDraft == false) | [.assets[].name] | join(",")' 2>/dev/null || true)
          if [[ "$ASSETS" == *Marq.exe* && "$ASSETS" == *latest.txt* ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already released; this run only checks that it builds."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is not fully released yet; it will be published."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: |
          set -o pipefail
          if ! cargo build --release 2>&1 | tee build.log; then
            # Surface compiler errors as annotations on the run page.
            grep -A6 '^error' build.log | head -60 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Test
        run: cargo test --release

      - name: Package
        run: |
          cp target/release/marq.exe Marq.exe
          SHA=$(sha256sum Marq.exe | cut -d' ' -f1)
          printf '%s\n%s\n' "${{ steps.ver.outputs.version }}" "$SHA" > latest.txt
          cat latest.txt
          ls -l Marq.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Marq-${{ steps.ver.outputs.version }}
          path: |
            Marq.exe
            latest.txt

      # Draft first, upload, then go live: clients never see a release missing its files.
      - name: Publish release
        if: steps.ver.outputs.exists == 'false'
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft=true
          else
            gh release create "$TAG" --draft \
              --title "Marq $TAG" \
              --target "${{ github.sha }}" \
              --generate-notes
          fi
          gh release upload "$TAG" Marq.exe latest.txt --clobber
          gh release edit "$TAG" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
